<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2e8b57" />
    <meta
      name="description"
      content="School Appointment Portal - Book and manage appointments"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/images/duck-logo.svg" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>School Appointment Portal</title>
    <style>
      .loading-message {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        font-family: Arial, sans-serif;
        color: #333;
      }
      .loading-spinner {
        border: 4px solid rgba(0, 0, 0, 0.1);
        border-radius: 50%;
        border-top: 4px solid #2e8b57; /* Green from the college logo */
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .error-message {
        display: none;
        margin-top: 20px;
        padding: 15px;
        background-color: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
        border-radius: 4px;
        max-width: 80%;
      }
      .debug-link {
        margin-top: 20px;
        font-size: 14px;
      }
      .debug-link a {
        color: #6c757d;
        text-decoration: none;
      }
      .debug-link a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <!-- This loading message will be replaced when React renders -->
      <div class="loading-message">
        <div style="display: flex; gap: 20px; margin-bottom: 20px;">
          <img src="%PUBLIC_URL%/images/duckster-logo.png" alt="Duck Logo" style="height: 60px; width: auto;" />
          <img src="%PUBLIC_URL%/images/ptc-logo.png" alt="College Logo" style="height: 60px; width: auto;" />
        </div>
        <div class="loading-spinner"></div>
        <h2>Loading School Appointment Portal...</h2>
        <div id="error-message" class="error-message"></div>
        <div class="debug-link">
          <a href="debug.html">Troubleshoot connection issues</a> |
          <a href="test.html">Test API connection</a>
        </div>
      </div>
    </div>

    <script>
      // Simple error handling to catch React initialization errors
      window.addEventListener('error', function(event) {
        console.error('Global error caught:', event.error);
        var errorMessage = document.getElementById('error-message');
        if (errorMessage) {
          errorMessage.style.display = 'block';
          errorMessage.innerHTML = '<strong>Error loading the application:</strong><br>' +
            (event.error ? event.error.message : 'Unknown error') +
            '<br><br>Please check the browser console for more details.';
        }
      });

      // Set a timeout to show troubleshooting links if the app doesn't load
      setTimeout(function() {
        if (document.querySelector('.loading-message')) {
          var errorMessage = document.getElementById('error-message');
          if (errorMessage) {
            errorMessage.style.display = 'block';
            errorMessage.innerHTML = '<strong>The application is taking longer than expected to load.</strong><br>' +
              'This could be due to connection issues or JavaScript errors.<br><br>' +
              'Please try the troubleshooting links below.';
          }
        }
      }, 10000); // 10 seconds
    </script>
  </body>
</html>
