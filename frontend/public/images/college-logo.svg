<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <!-- Outer green circle -->
  <circle cx="250" cy="250" r="240" fill="#2e8b57"/>
  
  <!-- Text on top curved path -->
  <path id="topCurve" d="M250,50 A200,200 0 0,1 450,250" fill="none"/>
  <text font-family="Arial" font-weight="bold" font-size="24" fill="#000">
    <textPath href="#topCurve" startOffset="5%">PATEROS TECHNOLOGICAL COLLEGE</textPath>
  </text>
  
  <!-- Text on bottom curved path -->
  <path id="bottomCurve" d="M250,450 A200,200 0 0,1 50,250" fill="none"/>
  <text font-family="Arial" font-weight="bold" font-size="24" fill="#000">
    <textPath href="#bottomCurve" startOffset="5%">PATEROS METRO MANILA</textPath>
  </text>
  
  <!-- Yellow gear -->
  <circle cx="250" cy="250" r="180" fill="#ffde00"/>
  <path d="M250,70 L270,70 L275,100 L225,100 L230,70 Z" fill="#ffde00"/>
  <path d="M250,430 L270,430 L275,400 L225,400 L230,430 Z" fill="#ffde00"/>
