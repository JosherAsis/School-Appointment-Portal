  <path d="M150,200 C170,220 170,280 150,300" fill="none" stroke="#2e8b57" stroke-width="5"/>
  
  <!-- Laurel leaves right -->
  <path d="M330,180 C350,200 350,300 330,320" fill="none" stroke="#2e8b57" stroke-width="5"/>
  <path d="M330,180 C310,200 310,300 330,320" fill="none" stroke="#2e8b57" stroke-width="5"/>
  <path d="M340,190 C360,210 360,290 340,310" fill="none" stroke="#2e8b57" stroke-width="5"/>
