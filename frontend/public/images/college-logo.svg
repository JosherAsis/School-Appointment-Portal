  <path d="M350,200 C330,220 330,280 350,300" fill="none" stroke="#2e8b57" stroke-width="5"/>
  
  <!-- Sun rays -->
  <path d="M250,150 L250,110" stroke="#ffde00" stroke-width="8"/>
  <path d="M230,152 L215,115" stroke="#ffde00" stroke-width="8"/>
  <path d="M270,152 L285,115" stroke="#ffde00" stroke-width="8"/>
  <path d="M215,165 L185,135" stroke="#ffde00" stroke-width="8"/>
  <path d="M285,165 L315,135" stroke="#ffde00" stroke-width="8"/>
  
  <!-- Philippine flag colors -->
  <path d="M200,250 A50,50 0 0,1 250,200 A50,50 0 0,1 300,250 A50,50 0 0,1 250,300 A50,50 0 0,1 200,250 Z" fill="none"/>
  <path d="M200,250 A50,50 0 0,1 250,200 L250,250 Z" fill="#0000ff"/>
  <path d="M250,200 A50,50 0 0,1 300,250 L250,250 Z" fill="#ff0000"/>
