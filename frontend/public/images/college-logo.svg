  <path d="M250,300 A50,50 0 0,1 200,250 L250,250 Z" fill="#0000ff"/>
  
  <!-- Eagle/bird silhouette -->
  <path d="M250,200 C270,190 290,210 250,230 C210,210 230,190 250,200 Z" fill="#000"/>
  
  <!-- Year text -->
  <text x="250" y="330" font-family="Arial" font-size="16" text-anchor="middle" fill="#000">1993</text>
  
  <!-- Small dots representing rice/pearls -->
  <circle cx="230" cy="260" r="5" fill="white"/>
  <circle cx="240" cy="265" r="5" fill="white"/>
  <circle cx="250" cy="270" r="5" fill="white"/>
