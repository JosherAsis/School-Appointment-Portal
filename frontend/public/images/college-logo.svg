  <path d="M170,180 C150,200 150,300 170,320" fill="none" stroke="#2e8b57" stroke-width="5"/>
  <path d="M170,180 C190,200 190,300 170,320" fill="none" stroke="#2e8b57" stroke-width="5"/>
  <path d="M160,190 C140,210 140,290 160,310" fill="none" stroke="#2e8b57" stroke-width="5"/>
